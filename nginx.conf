server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Health check (was served by the old Flask app)
    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location = /home.html { return 308 /; }
    # Archived tools (see archive/): send old links home, temporarily
    location ~ ^/(blanks|techpack|dropcalc)\.html$ { return 307 /; }

    # The marketplace and profile pages (the same rewrites as vercel.json)
    location = /market { rewrite ^ /market.html last; }
    location ~ ^/u/([a-z0-9-]{1,40})$ { rewrite ^/u/([a-z0-9-]+)$ /profile.html?u=$1 last; }

    location / {
        try_files $uri $uri/ =404;
    }

    # File names are not content-hashed, so always revalidate.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
