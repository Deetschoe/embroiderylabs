<script>
var T = { cache: {} };
/* A big design made here, not by the engine: about 105,000 stitches of fill in five colours, lying over each other.
   The renderer's checks must not depend on what the engine currently makes of its own stress design (it now
   refuses tests/engine/designs.js 'heavy' as over 500,000 stitches, which left these checks with nothing to draw). */
T.heavy = function () {
  var st = [], cols = ['#654321', '#123456', '#c0392b', '#e8d9a0', '#2e7d5b'], l, row, x, y, x0, x1, n = 0;
  for (l = 0; l < 5; l++) {
    if (l) st.push(3, 0, 0);
    for (row = 0; row < 350; row++) {
      y = 50 + l * 20 + row * 2; x0 = 50 + l * 30 + (row % 3) * 5; x1 = 950 - l * 30;
      st.push(row ? 0 : 1, row % 2 ? x1 : x0, y);
      if (row % 2) for (x = x1; x >= x0; x -= 15) { st.push(0, x, y); n++; } else for (x = x0; x <= x1; x += 15) { st.push(0, x, y); n++; }
    }
  }
  st.push(4, 0, 0);
  return { stitches: new Int32Array(st), threads: cols, hoop: { width: 100, height: 90 } };
};
T.design = function (name) { return T.cache[name] || (T.cache[name] = name === 'heavy' ? T.heavy() : Engine.generate(EngineTestDesigns.designs[name])); };
T.canvas = function (w, h) { var cv = document.createElement('canvas'); cv.width = w; cv.height = h; document.body.appendChild(cv); return cv; };
T.hash = function (d) { var h = 2166136261, i; for (i = 0; i < d.length; i++) { h ^= d[i]; h = Math.imul(h, 16777619); } return h >>> 0; };
/* what a picture looks like in numbers */
T.measure = function (cv, rect) {
  var W = cv.width, H = cv.height, d = cv.getContext('2d').getImageData(0, 0, W, H).data, x, y, q, n = W * H;
  var sum = [0, 0, 0], lo = 255, hi = 0, opaque = 0, colours = {}, nc = 0, inside = 0, outside = 0, ni = 0, no = 0, sat;
  for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
    q = (y * W + x) * 4; sum[0] += d[q]; sum[1] += d[q + 1]; sum[2] += d[q + 2]; if (d[q + 3] > 250) opaque++;
    if (d[q + 1] < lo) lo = d[q + 1]; if (d[q + 1] > hi) hi = d[q + 1];
    if (nc < 5000) { var key = (d[q] >> 3) << 10 | (d[q + 1] >> 3) << 5 | (d[q + 2] >> 3); if (!colours[key]) { colours[key] = 1; nc++; } }
    if (rect) { sat = Math.max(d[q], d[q + 1], d[q + 2]) - Math.min(d[q], d[q + 1], d[q + 2]); if (x >= rect.x && x < rect.x + rect.width && y >= rect.y && y < rect.y + rect.height) { inside += sat; ni++; } else { outside += sat; no++; } }
  }
  return { hash: T.hash(d), mean: [sum[0] / n, sum[1] / n, sum[2] / n], lo: lo, hi: hi, opaque: opaque / n, colours: nc, satInside: ni ? inside / ni : 0, satOutside: no ? outside / no : 0 };
};
T.render = async function (name, w, h, options, keep) {
  var cv = T.canvas(w, h), stats = await Realistic.render(cv, typeof name === 'string' ? T.design(name) : name, options || {});
  var out = { stats: stats, m: T.measure(cv, stats.designRect) }; if (!keep) cv.remove(); return out;
};
T.blobInfo = async function (blob) {
  var bytes = new Uint8Array(await blob.arrayBuffer()), bmp = await createImageBitmap(blob), cv = T.canvas(bmp.width, bmp.height); cv.getContext('2d').drawImage(bmp, 0, 0);
  var d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data, clear = 0, solid = 0, i; for (i = 3; i < d.length; i += 4) { if (d[i] === 0) clear++; else if (d[i] > 250) solid++; }
  var out = { type: blob.type, size: blob.size, sig: Array.prototype.slice.call(bytes, 0, 8), width: bmp.width, height: bmp.height, clear: clear / (d.length / 4), solid: solid / (d.length / 4) }; cv.remove(); return out;
};
</script>
